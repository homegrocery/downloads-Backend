services:
  - type: web
    name: home-grocery-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_MOBILE_NUMBER
        value: "9356755100"
      - key: RECOVERY_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "720"
      - key: MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOCKOUT_MINUTES
        value: "15"
